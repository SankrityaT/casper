<!doctype html><html><head><style>
body{margin:0;height:640px;background:repeating-linear-gradient(90deg,#111 0 18px,#f08a45 18px 36px);font-family:sans-serif}
.g{position:absolute;top:120px;isolation:isolate}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-2;backdrop-filter:var(--lens)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.spec{position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.5px;background:conic-gradient(from 225deg,rgba(255,255,255,.95),rgba(255,255,255,.15) 18%,rgba(255,255,255,.05) 35%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.08) 65%,rgba(255,255,255,.15) 82%,rgba(255,255,255,.95));
 -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
</style></head><body>
<svg width="0" height="0" style="position:absolute" id="defs"></svg>
<div class="g" id="p1" style="left:40px;width:300px;height:300px;border-radius:60px"><div class="spec"></div></div>
<div class="g" id="p2" style="left:400px;width:420px;height:76px;border-radius:38px"><div class="spec"></div></div>
<div class="g" id="p3" style="left:400px;top:260px;width:240px;height:400px;border-radius:28px"><div class="spec"></div></div>
<script src="lens.js"></script>
<script>document.querySelectorAll('.g').forEach(g=>Lens.apply(g,{}));</script>
</body></html>
