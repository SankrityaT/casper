<style>
*{box-sizing:border-box} body{margin:0;background:#151413;color:#f3efe9;padding:28px;font-family:system-ui}
.top{max-width:1480px;margin:0 auto 18px;color:#a39d95;font:500 14px system-ui}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1480px;margin:0 auto}
.card{background:#1f1d1b;border-radius:14px;box-shadow:inset 0 0 0 1px #2e2a27;padding:20px 20px 18px;position:relative}
.meta{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;font:500 12px system-ui;color:#8f8981}
.meta b{color:#f3efe9;font:600 13px system-ui}.meta span{margin-left:auto}
.ghost{position:absolute;right:18px;top:46px;width:40px;height:40px}
h2{margin:0;font-size:30px;line-height:1.05}
h2 i{color:#f08a45}
.lead{color:#a39d95;margin:8px 0 14px;font-size:13.5px;line-height:1.5;max-width:40ch}
.box{background:#282523;border-radius:11px;box-shadow:inset 0 0 0 1px #34302c}
.r{display:flex;gap:11px;align-items:center;padding:10px 12px;border-top:1px solid #34302c;font-size:13px}.r:first-child{border:0}
.r b{display:block}.r .s{color:#8f8981;font-size:12.5px}
.ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 10.5px system-ui;color:#fff;flex:none}
.st{margin-left:auto;color:#c9c2b8;font-size:12.5px;white-space:nowrap}.st i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.row2{display:flex;align-items:center;gap:10px;margin-top:14px}
.bt{font-size:13px;padding:6px 12px;border-radius:8px;background:#f3efe9;color:#1f1d1b}
.num{margin-left:auto;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.code{margin-top:12px;font:400 12px "JetBrains Mono";color:#c9c2b8;background:#171513;border-radius:8px;padding:8px 10px}
.why{margin-top:12px;color:#a39d95;font:400 12.5px/1.5 system-ui}
</style></head><body>
<div class="top">Same screen, six font pairings. Only the fonts change. All free for commercial use (Fontshare or Google Fonts). Code font is JetBrains Mono in all six.</div>
<div class="grid" id="g"></div>
<script>
const P=[
 {n:'A · Switzer',src:'Fontshare',h:"'Switzer'",hw:600,hs:'-.03em',b:"'Switzer'",bw:400,ital:false,why:'Swiss neo-grotesk. Calm, precise, very “serious tool” (think Linear, Vercel). Safest professional choice.'},
 {n:'B · Satoshi',src:'Fontshare',h:"'Satoshi'",hw:700,hs:'-.03em',b:"'Satoshi'",bw:500,ital:false,why:'Geometric and modern, slightly friendlier. Popular with well-designed startups; reads great on dark.'},
 {n:'C · General Sans + Gambetta',src:'Fontshare',h:"'Gambetta'",hw:400,hs:'-.01em',b:"'General Sans'",bw:400,ital:true,why:'Neutral UI text with an elegant serif for titles only. Feels editorial and premium.'},
 {n:'D · Inter + Instrument Serif',src:'Google',h:"'Instrument Serif'",hw:400,hs:'0',b:"'Inter'",bw:450,ital:true,why:'The “with character” option from the comparison. Inter is the industry standard; the serif adds warmth.'},
 {n:'E · Instrument Sans + Serif',src:'Google',h:"'Instrument Serif'",hw:400,hs:'0',b:"'Instrument Sans'",bw:450,ital:true,why:'Sans and serif from one family, so they match exactly. A little more personality than Inter.'},
 {n:'F · Schibsted Grotesk',src:'Google',h:"'Schibsted Grotesk'",hw:700,hs:'-.035em',b:"'Schibsted Grotesk'",bw:450,ital:false,why:'Made for a news publisher: confident headlines, very readable small text. Professional with a bit of edge.'},
];
const rows=[["GH","#24292f","GitHub","acme/app, acme/api","Connected","#5fcf86"],["Z","#2d8cff","Zoom","Transcripts from eng meetings","Connected","#5fcf86"],["M","#c5221f","Gmail","Login on Wick’s computer","Via login","#f08a45"]];
const ghost=`<svg class="ghost" viewBox="0 0 120 120"><circle cx="60" cy="48" r="30" fill="#0e0d0c"/><path fill="#0e0d0c" d="M30 56 C30 84 44 102 62 108 C74 112 86 106 92 98 C84 100 76 96 74 88 C86 76 90 62 88 52 Z"/><ellipse cx="50" cy="44" rx="4.5" ry="6.5" fill="#f5cd63"/><ellipse cx="70" cy="44" rx="4.5" ry="6.5" fill="#f5cd63"/></svg>`;
document.getElementById('g').innerHTML=P.map(p=>`<div class="card" style="font-family:${p.b};font-weight:${p.bw}">
  <div class="meta"><b>${p.n}</b><span>${p.src}</span></div>${ghost}
  <h2 style="font-family:${p.h};font-weight:${p.hw};letter-spacing:${p.hs};${p.ital?'font-size:34px':''}">${p.ital?'Connec<i style="font-style:italic">tions</i>':'Connections'}</h2>
  <p class="lead">Apps this space uses, and which agents may touch each one.</p>
  <div class="box">${rows.map(r=>`<div class="r"><span class="ic" style="background:${r[1]}">${r[0]}</span><div><b style="font-weight:${p.bw+100}">${r[2]}</b><div class="s">${r[3]}</div></div><span class="st"><i style="background:${r[5]}"></i>${r[4]}</span></div>`).join('')}</div>
  <div class="row2"><span class="bt" style="font-weight:${p.bw+100}">Approve and push</span><span style="color:#a39d95;font-size:13px">Spent in October</span><span class="num" style="font-family:${p.h==="'Instrument Serif'"||p.h==="'Gambetta'"?p.b:p.h};font-weight:${p.hw===400?600:p.hw}">$893.50</span></div>
